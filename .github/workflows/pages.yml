name: Update events and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 6 * * *'
      timezone: 'Asia/Taipei'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Find latest successful event data
        id: saved-data
        uses: actions/github-script@v8
        with:
          script: |
            const findEventData = require('./.github/scripts/find-event-data.cjs');
            await findEventData({github, context, core});

      - name: Restore saved event data
        if: steps.saved-data.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.saved-data.outputs.artifact-id }}
          run-id: ${{ steps.saved-data.outputs.run-id }}
          github-token: ${{ github.token }}
          path: dist/data
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install updater dependencies
        if: github.event_name != 'push'
        run: python -m pip install -r requirements.txt

      - name: Run updater regression checks
        if: github.event_name != 'push'
        run: python -m unittest discover -s tests -v

      - name: Check saved data selection
        run: node --test tests/test_event_data.cjs

      - name: Validate restored or initial JSON
        run: python -m json.tool dist/data/events.json > /dev/null

      - name: Update event data
        if: github.event_name != 'push'
        env:
          PYTHONUTF8: '1'
          ASIAA_ACCESS_MODE: public-html
        run: python update_events.py --asiaa-access public-html --allow-partial

      - name: Upload updater diagnostics
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: updater-diagnostics
          path: reports/latest.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Validate generated JSON
        run: python -m json.tool dist/data/events.json > /dev/null

      - name: Save event data for the next run
        uses: actions/upload-artifact@v4
        with:
          name: event-data
          path: dist/data/events.json
          if-no-files-found: error
          retention-days: 90

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
