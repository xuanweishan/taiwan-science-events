name: Update events and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 6 * * *'
      timezone: 'Asia/Taipei'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install updater dependencies
        if: github.event_name != 'push'
        run: python -m pip install -r requirements.txt

      - name: Update event data
        if: github.event_name != 'push'
        env:
          PYTHONUTF8: '1'
          ASIAA_ACCESS_MODE: public-html
        run: python update_events.py --asiaa-access public-html

      - name: Validate generated JSON
        if: github.event_name != 'push'
        run: python -m json.tool dist/data/events.json > /dev/null

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- dist/data/events.json reports/latest.json; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/data/events.json reports/latest.json
            git commit -m "chore: update event data"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
