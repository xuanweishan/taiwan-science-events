<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Mathematics, physics and astronomy events around NTU and Drunken Moon Lake.">
  <title>醉月湖數理週覽</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div>
      <div class="eyebrow">DRUNKEN MOON LAKE MATH &amp; PHYSICS WEEKLY</div>
      <h1 data-i18n="title">醉月湖數理週覽</h1>
      <p class="subtitle" data-i18n="subtitle">數學、物理與天文的近期學術活動。</p>
    </div>
    <div class="header-actions">
      <button id="langToggle" type="button" aria-label="Switch language">English</button>
      <span class="tz">UTC+8</span>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="Filters">
      <div class="range-control">
        <span id="rangeLabel" data-i18n="range">範圍</span>
        <div class="range-toggle" role="group" aria-labelledby="rangeLabel">
          <button type="button" data-range="upcoming" aria-pressed="true" data-i18n="upcoming">未來七天</button>
          <button type="button" data-range="recent" aria-pressed="false" data-i18n="recent">過去七天</button>
        </div>
      </div>
      <label>
        <span data-i18n="institution">機構</span>
        <select id="sourceFilter"><option value="all" data-i18n="allInstitutions">全部機構</option></select>
      </label>
      <label class="search-box">
        <span data-i18n="search">搜尋</span>
        <input id="searchInput" type="search" autocomplete="off">
      </label>
    </section>

    <div class="agenda-layout">
      <div class="agenda-main">
        <section class="meta" id="meta" aria-live="polite"></section>
        <section id="notice" class="notice" hidden></section>
        <section id="events" class="events" aria-live="polite"></section>
      </div>
      <aside class="sources-panel" aria-labelledby="sourcesHeading">
        <h2 id="sourcesHeading" data-i18n="sourceStatus">來源狀態</h2>
        <div id="sources"></div>
      </aside>
    </div>
  </main>

  <footer>
    <span data-i18n="footer">活動資訊以原始機構公告為準。</span>
  </footer>
  <button id="backToTop" class="back-to-top" type="button" hidden>
    <span aria-hidden="true">↑</span>
    <span data-i18n="backToTop">回到頂部</span>
  </button>
</body>
</html>
